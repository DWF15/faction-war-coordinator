name: Promote v0.15.3 userscript

on:
  push:
    paths:
      - '.github/workflows/promote-v0153.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.15.3 PDA OFF hotfix
        shell: python
        run: |
          from pathlib import Path

          path = Path('faction-war-coordinator.user.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('// @version      0.15.2', '// @version      0.15.3'),
              ('grid-template-columns:minmax(100px,1fr) auto auto auto;', 'grid-template-columns:minmax(88px,1fr) auto auto auto auto;'),
              ('#${ROOT_ID} .frt-compact-top button { min-width:0; height:34px; padding:0 8px;', '#${ROOT_ID} .frt-compact-top button { min-width:0; height:34px; padding:0 6px;'),
              ('        #${ROOT_ID} .frt-compact-settings { background:#2a3036; }\n', '        #${ROOT_ID} .frt-compact-settings { background:#2a3036; }\n        #${ROOT_ID} .frt-compact-off { background:#20252a; color:#b9c0c7; }\n'),
              ('        <button type="button" class="frt-compact-settings">SETTINGS</button>\n', '        <button type="button" class="frt-compact-settings">SETTINGS</button>\n        <button type="button" class="frt-compact-off">OFF</button>\n'),
              ("    root.querySelector('.frt-off').addEventListener('click', () => { closeRotationEditor(); closeSettings(); closeTransitionAlert(); cancelAttackRepeat(); setEnabled(false); stopPolling(); render(); });", "    root.querySelectorAll('.frt-off, .frt-compact-off').forEach(button => button.addEventListener('click', () => { closeRotationEditor(); closeSettings(); closeTransitionAlert(); cancelAttackRepeat(); setEnabled(false); stopPolling(); render(); }));"),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected v0.15.2 text not found: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate userscript
        run: |
          node --check faction-war-coordinator.user.js
          grep -F '// @version      0.15.3' faction-war-coordinator.user.js
          grep -F 'class="frt-compact-off">OFF</button>' faction-war-coordinator.user.js

      - name: Commit promotion
        run: |
          rm .github/workflows/promote-v0153.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add faction-war-coordinator.user.js .github/workflows/promote-v0153.yml
          git commit -m 'Promote userscript v0.15.3 PDA OFF hotfix'
          git push

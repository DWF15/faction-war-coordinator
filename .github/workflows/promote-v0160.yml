name: Promote v0.16.0 userscript

on:
  push:
    paths:
      - '.github/workflows/promote-v0160.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build tested v0.16.0 userscript
        run: python tools/build_v0160.py
      - name: Promote canonical userscript
        run: cp MWC-Torn-Remote-Bridge-v0.16.0/faction-war-coordinator.user.js faction-war-coordinator.user.js
      - name: Validate promotion
        run: |
          node --check faction-war-coordinator.user.js
          grep -F '// @version      0.16.0' faction-war-coordinator.user.js
          grep -F 'FULL ROTATION OVERVIEW' faction-war-coordinator.user.js
          grep -F 'ROTATION_OVERVIEW_ID' faction-war-coordinator.user.js
          test "$(grep -o '###PDA-APIKEY###' faction-war-coordinator.user.js | wc -l)" -eq 1
      - name: Commit promotion
        run: |
          rm .github/workflows/promote-v0160.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add faction-war-coordinator.user.js .github/workflows/promote-v0160.yml
          git commit -m 'Promote userscript v0.16.0 coordinator rotation overview'
          git push

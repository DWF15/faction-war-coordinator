name: Promote v0.15.4 userscript

on:
  push:
    paths:
      - '.github/workflows/promote-v0154.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.15.4 alert-state hotfix
        shell: python
        run: |
          from pathlib import Path
          p = Path('faction-war-coordinator.user.js')
          t = p.read_text(encoding='utf-8')
          changes = [
            ('// @version      0.15.3', '// @version      0.15.4'),
            ("      const stored = storedAlertStage();\n      lastAlertStage = stored === undefined ? current.stage : stored;\n      rememberAlertStage(current.stage);\n      // A page/layout reinjection must never turn an unchanged status into a\n      // fresh alert. Only a real Coordinator state transition after baseline\n      // initialization is allowed to notify the user.\n", "      // Always baseline to the state observed by this live script instance.\n      // Do not seed lastAlertStage from sessionStorage: a stale stored stage\n      // can make a resize/PDA reinjection look like a new transition on the\n      // very next timer tick. Genuine alerts begin only after this baseline.\n      lastAlertStage = current.stage;\n      rememberAlertStage(current.stage);\n"),
            ('    evaluateAlertTransition();\n    return previousView !== viewStateSignature();', "    if (options.evaluateAlerts !== false) evaluateAlertTransition();\n    return previousView !== viewStateSignature();"),
            ('      applyState(cached.data, { persist: false });\n      lastSuccessAt = Number(cached.saved_at);', "      // Cached state is display-only during boot. It must never establish an\n      // alert baseline because it may be stale relative to the first live poll.\n      // The first successful live response establishes the baseline silently.\n      applyState(cached.data, { persist: false, evaluateAlerts: false });\n      lastSuccessAt = Number(cached.saved_at);"),
            ('      `Version: 0.13.1`,', '      `Version: 0.15.4`,'),
          ]
          for old, new in changes:
              if old not in t:
                  raise SystemExit('Expected v0.15.3 source fragment not found')
              t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
      - name: Validate userscript
        run: |
          node --check faction-war-coordinator.user.js
          grep -F '// @version      0.15.4' faction-war-coordinator.user.js
          grep -F 'applyState(cached.data, { persist: false, evaluateAlerts: false });' faction-war-coordinator.user.js
      - name: Commit promotion
        run: |
          rm .github/workflows/promote-v0154.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add faction-war-coordinator.user.js .github/workflows/promote-v0154.yml
          git commit -m 'Promote userscript v0.15.4 alert dedup hotfix'
          git push

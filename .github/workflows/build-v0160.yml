name: Build v0.16.0 userscript package

on:
  push:
    paths:
      - '.github/workflows/build-v0160.yml'
      - 'tools/build_v0160.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.16.0
        run: python tools/build_v0160.py
      - name: Validate userscript
        run: |
          node --check MWC-Torn-Remote-Bridge-v0.16.0/faction-war-coordinator.user.js
          grep -F '// @version      0.16.0' MWC-Torn-Remote-Bridge-v0.16.0/faction-war-coordinator.user.js
          grep -F 'FULL ROTATION OVERVIEW' MWC-Torn-Remote-Bridge-v0.16.0/faction-war-coordinator.user.js
          grep -F 'ROTATION_OVERVIEW_ID' MWC-Torn-Remote-Bridge-v0.16.0/faction-war-coordinator.user.js
      - name: Package
        run: zip -r MWC-Torn-Remote-Bridge-v0.16.0.zip MWC-Torn-Remote-Bridge-v0.16.0
      - uses: actions/upload-artifact@v4
        with:
          name: MWC-Torn-Remote-Bridge-v0.16.0
          path: MWC-Torn-Remote-Bridge-v0.16.0.zip
